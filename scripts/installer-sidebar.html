<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; }
  svg { display: block; }
</style>
</head>
<body>
<!-- Painel lateral do instalador NSIS: 164x314, sem transparência (BMP não
     guarda alfa). Mesma paleta do tema Dourado do app. -->
<svg width="164" height="314" viewBox="0 0 164 314" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fundo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242018"/>
      <stop offset="55%" stop-color="#1e1e1e"/>
      <stop offset="100%" stop-color="#151515"/>
    </linearGradient>
    <radialGradient id="brilho" cx="50%" cy="34%" r="52%">
      <stop offset="0%" stop-color="#4a3f22"/>
      <stop offset="100%" stop-color="#4a3f22" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="papel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
  </defs>

  <rect width="164" height="314" fill="url(#fundo)"/>
  <rect width="164" height="314" fill="url(#brilho)"/>

  <!-- mascote (mesmo desenho do ícone do app, reduzido) -->
  <g transform="translate(32, 58) scale(0.5)">
    <path d="M 55 128 Q 38 118 34 100" stroke="#c99a1d" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M 145 128 Q 162 118 166 100" stroke="#c99a1d" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M 52 52 H 128 L 148 72 V 148 Q 148 154 142 154 H 52 Q 46 154 46 148 V 58 Q 46 52 52 52 Z"
          fill="url(#papel)" stroke="#c99a1d" stroke-width="3"/>
    <path d="M 128 52 L 148 72 H 134 Q 128 72 128 66 Z" fill="#f5c400" stroke="#c99a1d" stroke-width="3" stroke-linejoin="round"/>
    <line x1="60" y1="128" x2="112" y2="128" stroke="#c99a1d" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
    <line x1="60" y1="138" x2="98" y2="138" stroke="#c99a1d" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
    <ellipse cx="65" cy="100" rx="8" ry="5.5" fill="#ff8fa3" opacity="0.55"/>
    <ellipse cx="129" cy="100" rx="8" ry="5.5" fill="#ff8fa3" opacity="0.55"/>
    <path d="M 72 90 Q 79 82 86 90" stroke="#4a3a08" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 108 90 Q 115 82 122 90" stroke="#4a3a08" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 91 102 Q 97 108 103 102" stroke="#4a3a08" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  </g>

  <text x="82" y="188" text-anchor="middle" font-family="Segoe UI, sans-serif"
        font-size="21" font-weight="bold" fill="#ffd700" letter-spacing="0.5">Note-Chan</text>
  <text x="82" y="209" text-anchor="middle" font-family="Segoe UI, sans-serif"
        font-size="10.5" fill="#bdb08a">Notas, listas e eventos</text>
  <text x="82" y="224" text-anchor="middle" font-family="Segoe UI, sans-serif"
        font-size="10.5" fill="#bdb08a">sempre no canto da tela</text>

  <path d="M 44 244 H 120" stroke="#ffd700" stroke-width="1" opacity="0.28"/>

  <!-- estrelinhas soltas, como no ícone -->
  <path d="M 132 44 l 2.6 5.8 5.8 2.6 -5.8 2.6 -2.6 5.8 -2.6 -5.8 -5.8 -2.6 5.8 -2.6 Z" fill="#fff3b0" opacity="0.85"/>
  <circle cx="26" cy="266" r="2.4" fill="#fff3b0" opacity="0.6"/>
  <circle cx="140" cy="284" r="1.8" fill="#fff3b0" opacity="0.45"/>
</svg>
</body>
</html>
