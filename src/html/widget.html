<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data:;
    font-src 'self';
  " />
  <title>Note-Chan</title>
  <link rel="stylesheet" href="css/Theme.css" />
  <link rel="stylesheet" href="css/Style.css" />
  <link rel="stylesheet" href="css/rich.css" />
</head>
<body>
  <div id="container">
    <div id="panel">
      <div id="dragbar" title="Clique para minimizar/expandir">
        <span id="dragbar-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span> Note-Chan
        <div id="window-btns">
          <span id="timer-badge"></span>
          <button class="window-btn" id="timerbtn" title="Cronômetro / Temporizador">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="12" x2="12" y2="7"/><line x1="12" y1="12" x2="16" y2="14"/></svg>
          </button>
          <button class="window-btn" id="searchbtn" title="Buscar (Ctrl+F)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="20" y1="20" x2="15.5" y2="15.5"/></svg>
          </button>
          <button class="window-btn" id="settingsbtn" title="Configurações">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <button class="window-btn" id="minbtn" title="Minimizar">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg>
          </button>
          <button class="window-btn" id="closebtn" title="Fechar">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
      </div>

      <div id="tabs">
        <button class="tab-btn" id="tab-notas" data-tab="notas"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg> Notas</button>
        <button class="tab-btn" id="tab-listas" data-tab="listas"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 5h8"/><path d="M13 12h8"/><path d="M13 19h8"/><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/></svg> Listas</button>
        <button class="tab-btn" id="tab-eventos" data-tab="eventos"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v3"/><path d="M16 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></svg> Eventos</button>
      </div>

      <div id="new-btn-container">
        <button id="new-btn">+ Nova nota</button>
      </div>

      <div id="search-bar">
        <input type="text" id="search-input" placeholder="Buscar por título..." autocomplete="off" spellcheck="false" />
      </div>

      <div id="timer-panel">
        <div class="timer-mode-toggle">
          <button type="button" class="timer-mode-btn active" data-mode="stopwatch">Cronômetro</button>
          <button type="button" class="timer-mode-btn" data-mode="timer">Temporizador</button>
        </div>
        <div class="timer-display" id="timer-display">00:00</div>
        <div class="timer-duration-row" id="timer-duration-row">
          <input type="number" id="timer-minutes" min="0" max="180" value="5" /><span>min</span>
          <input type="number" id="timer-seconds" min="0" max="59" value="0" /><span>seg</span>
        </div>
        <div class="timer-controls">
          <button type="button" id="timer-start-btn" class="timer-action-btn"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg> Iniciar</button>
          <button type="button" id="timer-reset-btn" class="timer-action-btn secondary"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg> Zerar</button>
        </div>
      </div>

      <div id="board"></div>

      <div id="tama-overlay">
        <div id="tama-header">
          <button id="tama-back-btn" title="Voltar"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
          <div id="tama-level-wrap">
            <span id="tama-level">Nível 1</span>
            <div class="tama-bar tama-xp-bar"><div class="tama-bar-fill" id="tama-xp-fill"></div></div>
          </div>
        </div>

        <div id="tama-stats">
          <div class="tama-stat-row">
            <span class="tama-stat-icon" title="Vida"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/></svg></span>
            <div class="tama-bar"><div class="tama-bar-fill tama-bar-vida" id="tama-bar-vida"></div></div>
          </div>
          <div class="tama-stat-row">
            <span class="tama-stat-icon" title="Fome"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg></span>
            <div class="tama-bar"><div class="tama-bar-fill tama-bar-fome" id="tama-bar-fome"></div></div>
          </div>
          <div class="tama-stat-row">
            <span class="tama-stat-icon" title="Carência"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.414 14.414C21 12.828 22 11.5 22 9.5a5.5 5.5 0 0 0-9.591-3.676.6.6 0 0 1-.818.001A5.5 5.5 0 0 0 2 9.5c0 2.3 1.5 4 3 5.5l5.535 5.362a2 2 0 0 0 2.879.052 2.12 2.12 0 0 0-.004-3 2.124 2.124 0 1 0 3-3 2.124 2.124 0 0 0 3.004 0 2 2 0 0 0 0-2.828l-1.881-1.882a2.41 2.41 0 0 0-3.409 0l-1.71 1.71a2 2 0 0 1-2.828 0 2 2 0 0 1 0-2.828l2.823-2.762"/></svg></span>
            <div class="tama-bar"><div class="tama-bar-fill tama-bar-carencia" id="tama-bar-carencia"></div></div>
          </div>
          <div class="tama-stat-row">
            <span class="tama-stat-icon" title="Higiene"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 4 2.5 2.5"/><path d="M13.5 6.5a4.95 4.95 0 0 0-7 7"/><path d="M15 5 5 15"/><path d="M14 17v.01"/><path d="M10 16v.01"/><path d="M13 13v.01"/><path d="M16 10v.01"/><path d="M11 20v.01"/><path d="M17 14v.01"/><path d="M20 11v.01"/></svg></span>
            <div class="tama-bar"><div class="tama-bar-fill tama-bar-higiene" id="tama-bar-higiene"></div></div>
          </div>
        </div>

        <div id="tama-stage">
          <div id="tama-sprite"></div>
        </div>

        <div id="tama-tabs">
          <button class="tama-tab-btn active" data-tab="comida"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.528V3a1 1 0 0 1 1-1h0"/><path d="M18.237 21A15 15 0 0 0 22 11a6 6 0 0 0-10-4.472A6 6 0 0 0 2 11a15.1 15.1 0 0 0 3.763 10 3 3 0 0 0 3.648.648 5.5 5.5 0 0 1 5.178 0A3 3 0 0 0 18.237 21"/></svg> Comida</button>
          <button class="tama-tab-btn" data-tab="brinquedos"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="12" x="3" y="8" rx="1"/><path d="M10 8V5c0-.6-.4-1-1-1H6a1 1 0 0 0-1 1v3"/><path d="M19 8V5c0-.6-.4-1-1-1h-3a1 1 0 0 0-1 1v3"/></svg> Brinquedos</button>
          <button class="tama-tab-btn" data-tab="higiene"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"/><path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97"/></svg> Higiene</button>
        </div>

        <div id="tama-actions"></div>
      </div>
    </div>

    <button id="tama-fab" title="Bichinho virtual">
      <div id="tama-fab-sprite"></div>
    </button>

    <div id="drop-hint"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 6-8.414 8.586a2 2 0 0 0 2.829 2.829l8.414-8.586a4 4 0 1 0-5.657-5.657l-8.379 8.551a6 6 0 1 0 8.485 8.485l8.379-8.551"/></svg> Solte o arquivo para criar uma nota</div>
  </div>

  <script src="../js/Logger.js"></script>
  <script src="../js/EventUtils.js"></script>
  <script src="../js/TagUtils.js"></script>
  <script src="../js/TamaSprite.js"></script>
  <script src="../js/Icons.js"></script>
  <script src="../js/UiUtils.js"></script>
  <script src="../js/RichText.js"></script>
  <script src="../js/RichEditor.js"></script>
  <script src="../js/AlarmSounds.js"></script>
  <script src="../js/TamaPet.js"></script>
  <script src="../js/Widget.js"></script>
</body>
</html>
